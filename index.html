<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>제타 주요지표 큐레이션 주간 리뷰 대시보드</title>
  <!-- Tailwind CSS & Lucide Icons & Chart.js -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800&display=swap');
    body { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; }
    .sparkline-svg { overflow: visible; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen pb-16">

  <!-- 상단 네비게이션 헤더 -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-xs">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center text-white shadow-md shadow-blue-500/20">
          <i data-lucide="bar-chart-2" class="w-5 h-5"></i>
        </div>
        <div>
          <div class="flex items-center space-x-2">
            <h1 class="text-lg font-bold text-slate-900 leading-tight">제타 주요지표 주간 리뷰</h1>
            <span class="px-2 py-0.5 text-xs font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200 rounded-md">운영 KPI</span>
          </div>
          <p class="text-xs text-slate-500">ZETTA Executive Weekly Performance Analytics</p>
        </div>
      </div>

      <div class="flex items-center space-x-3">
        <!-- 주차 선택 셀렉트박스 -->
        <div class="flex items-center space-x-2 bg-slate-100 px-3 py-1.5 rounded-lg border border-slate-200 text-sm">
          <span class="text-xs font-medium text-slate-500">리뷰 주차:</span>
          <select id="weekSelector" class="bg-transparent font-semibold text-slate-800 focus:outline-none cursor-pointer">
          </select>
        </div>

        <!-- 캡처 보기 버튼 -->
        <button id="viewRawCaptureBtn" class="hidden items-center space-x-1 px-3 py-2 bg-amber-50 text-amber-700 hover:bg-amber-100 text-xs font-semibold rounded-lg border border-amber-200 transition">
          <i data-lucide="image" class="w-4 h-4"></i>
          <span>원본 표 캡처 보기</span>
        </button>

        <!-- 데이터 추가 버튼 -->
        <button onclick="openDataModal()" class="flex items-center space-x-1.5 px-3.5 py-2 bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold rounded-lg shadow-sm transition">
          <i data-lucide="plus-circle" class="w-4 h-4"></i>
          <span>주간 데이터 추가/관리</span>
        </button>

        <!-- 초기화 버튼 (캐시 충돌 시 긴급 복구용) -->
        <button onclick="forceResetData()" title="데이터 캐시 재설정" class="p-2 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-lg text-xs transition">
          <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
        </button>

        <!-- 인쇄 버튼 -->
        <button onclick="window.print()" class="flex items-center space-x-1 px-3 py-2 bg-white hover:bg-slate-50 text-slate-700 text-xs font-medium rounded-lg border border-slate-200 transition">
          <i data-lucide="printer" class="w-4 h-4"></i>
          <span>인쇄</span>
        </button>
      </div>
    </div>
  </header>

  <!-- 메인 컨테이너 -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-6 space-y-6">

    <!-- 탭 네비게이션 -->
    <div class="flex items-center space-x-1 border-b border-slate-200 text-sm font-semibold">
      <button class="tab-btn px-4 py-2.5 text-blue-600 border-b-2 border-blue-600 flex items-center space-x-2" onclick="switchTab('summary')">
        <i data-lucide="layout-dashboard" class="w-4 h-4"></i>
        <span>요약 대시보드</span>
      </button>
      <button class="tab-btn px-4 py-2.5 text-slate-500 hover:text-slate-800 border-b-2 border-transparent flex items-center space-x-2" onclick="switchTab('trends')">
        <i data-lucide="line-chart" class="w-4 h-4"></i>
        <span>트렌드 심층 분석</span>
      </button>
      <button class="tab-btn px-4 py-2.5 text-slate-500 hover:text-slate-800 border-b-2 border-transparent flex items-center space-x-2" onclick="switchTab('table')">
        <i data-lucide="table" class="w-4 h-4"></i>
        <span>전체 지표 비교표</span>
      </button>
    </div>

    <!-- 탭 1: 요약 대시보드 -->
    <div id="tab-summary"
